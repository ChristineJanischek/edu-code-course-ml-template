name: ML Material und Start prüfen
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  materialcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/materialcheck.py
      - run: python tests/vorabcheck.py
      - run: python tests/offline_python_check.py
      - run: python tests/smoke_test.py
        env:
          MPLBACKEND: Agg
